name: ping

# Sends one tiny Haiku message on a fixed local grid so the Claude 5-hour usage window
# starts on a schedule you know, instead of whenever you happen to send your first message.

on:
  schedule:
    # Cron runs in UTC and has no time zones, so each grid hour is scheduled at both of its
    # possible UTC hours (Berlin is UTC+1 in winter, UTC+2 in summer). The job checks the local
    # hour and pings only on the run that is right today; the other run exits after a few seconds.
    # Minute 7, not 0: the top of the hour is when GitHub's scheduler is most congested.
    #   08 -> 06/07 UTC   13 -> 11/12 UTC   18 -> 16/17 UTC   23 -> 21/22 UTC
    - cron: '7 6,7,11,12,16,17,21,22 * * *'
  workflow_dispatch: # manual ping from the Actions tab, always sends

permissions: {}

env:
  TIMEZONE: Europe/Berlin
  GRID: '08 13 18 23' # local hours, two digits; keep the cron above in step

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the local hour
        id: slot
        run: |
          hour=$(TZ="$TIMEZONE" date +%H)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [[ " $GRID " == *" $hour "* ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "$TIMEZONE $hour:xx, pinging"
          else
            echo "$TIMEZONE $hour:xx is not a grid hour, skipping"
          fi

      - name: Ping
        if: steps.slot.outputs.go == 'true'
        env:
          # Subscription token from `claude setup-token`, not an API key: an API key bills the
          # API separately and never starts the subscription window.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Reply with the single word: ok" --model haiku
